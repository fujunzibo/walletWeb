# 软件宣传与下载站点 Nginx 配置
# 部署到 Linux 时复制到 /etc/nginx/sites-available/ 并启用：
#   sudo cp nginx/sites-available-my-site.conf /etc/nginx/sites-available/my-site
#   sudo ln -sf /etc/nginx/sites-available/my-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 将 your_domain.com 和 /var/www/my-site 替换为实际域名与路径

server {
    listen 80;
    server_name your_domain.com;

    root /var/www/my-site;
    index index.html;

    # 宣传页面
    location / {
        try_files $uri $uri/ =404;
    }

    # 具体文件（如 .apk）：强制下载，不弹“另存为”目录页
    location ~ ^/downloads/(.+)$ {
        alias /var/www/my-site/downloads/$1;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }
    # 目录 /downloads/：展示下载列表，不在浏览器里弹“另存为”
    location /downloads {
        alias /var/www/my-site/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # 可选：禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

