# 软件宣传与下载站点 Nginx 配置
# 部署到 Linux 时复制到 /etc/nginx/sites-available/ 并启用：
#   sudo cp nginx/sites-available-my-site.conf /etc/nginx/sites-available/my-site
#   sudo ln -sf /etc/nginx/sites-available/my-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 将 your_domain.com 和 /var/www/my-site 替换为实际域名与路径

server {
    listen 80;
    server_name your_domain.com;

    root /var/www/my-site;
    index index.html;

    # 宣传页面
    location / {
        try_files $uri $uri/ =404;
    }

    # 软件下载路径：目录列表 + 人类可读大小 + 本地时间
    location /downloads {
        alias /var/www/my-site/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # 强制下载而非预览（防止浏览器直接打开 txt/pdf 等）
        add_header Content-Disposition "attachment";
    }

    # 可选：禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

